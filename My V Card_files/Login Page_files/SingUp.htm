<!DOCTYPE html>
<html lang="en"><head>
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Erratum – Multi purpose error page template for Service, corporate, agency, Consulting, startup.">
    <meta name="keywords" content="Error page 404, page not found design, wrong url">
    <meta name="author" content="Ashishmaraviya">
    <link rel="icon" href="" type="image/x-icon">
    <link rel="shortcut icon" href="" type="image/x-icon">
    <title>Gate of Purchase => SingUp</title>
    <!--Google font-->
    <link href="SingUp_files/css2.css" rel="stylesheet">
    <!-- Bootstrap css -->
    <link rel="stylesheet" type="text/css" href="SingUp_files/bootstrap.css">
    <link rel="stylesheet" type="text/css" href="SingUp_files/fontawesome.css">
    <!-- Theme css -->
    <link rel="stylesheet" type="text/css" href="SingUp_files/login.css">
</head>

<body cz-shortcut-listen="true">
    <!-- 01 Preloader -->
    <div class="loader-wrapper" id="loader-wrapper" style="display: none;">
        <div class="loader"></div>
    </div>
    <!-- Preloader end -->
    <!-- 02 Main page -->
    <section class="page-section login-page">
        <div class="full-width-screen">
            <div class="container-fluid">
                <div class="content-detail">
                    <!-- Signup form -->
                    <form class="signup-form" method="post">
                        <div class="imgcontainer">
                            <img src="login_data/gate-of-purchase-high-resolution-logo-transparent-min.png" alt="logo" class="avatar">
                        </div>
                        <div class="input-control">
                            <div class="row p-l-5 p-r-5">
                                <div class="col-md-6 p-l-10 p-r-10">
                                    <input type="text" placeholder="Enter Username" name="uname" required="">
                                </div>
                                <div class="col-md-6 p-l-10 p-r-10">
                                    <input type="email" placeholder="Enter Email" name="email" required="">
                                </div>
                                <div class="col-md-6 p-l-10 p-r-10">
                                    <input type="password" placeholder="Enter Password" name="psw" class="input-checkmark" required="">
                                </div>
                                <div class="col-md-6 p-l-10 p-r-10">
                                    <span class="password-field-show">
                                        <input class="password-field input-checkmark" type="password" placeholder="Re-enter Password" name="psw" required="">
                                        <span data-toggle=".password-field" class=""></span>
                                    </span>
                                </div>
                            </div>
                            <label class="label-container">I agree with <a href="#"> privacy policy</a>
                                <input type="checkbox">
                                <span class="checkmark"></span>
                            </label>
                            <div class="login-btns">
                                <button type="submit">Sign up</button>
                            </div>
                            <div class="division-lines">
                                <p>or signup with</p>
                            </div>
                            <div class="login-with-btns">
                                <button type="button" class="facebook"><i class=""></i><img src="login_data/facebook-logo-button-Top_prev_ui.png" alt=""></button>
                                <button type="button" class="twitter"><i class=""></i><img src="twitter-logo-button-Pre.png" alt=""></button>
                                <span class="already-acc">Already you have an account? <a href="login.htm" class="login-btn">Login</a></span>
                            </div>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </section>
    <!-- latest jquery-->
    <script src="SingUp_files/jquery-3.5.1.min.js"></script>
    <!-- Theme js-->
    <script src="SingUp_files/script.js"></script>


</body></html>
