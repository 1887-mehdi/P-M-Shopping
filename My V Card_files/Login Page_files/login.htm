<!DOCTYPE html>
<html lang="en"><head>
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Erratum – Multi purpose error page template for Service, corporate, agency, Consulting, startup.">
    <meta name="keywords" content="Error page 404, page not found design, wrong url">
    <meta name="author" content="Ashishmaraviya">
    <link rel="icon" href="" type="image/x-icon">
    <link rel="shortcut icon" href="" type="image/x-icon">
    <title>Gate of Purchase => Login</title>
    <!--Google font-->
    <link href="login_data/css2.css" rel="stylesheet">
    <!-- Bootstrap css -->
    <link rel="stylesheet" type="text/css" href="login_data/bootstrap.css">
    <link rel="stylesheet" type="text/css" href="login_data/fontawesome.css">
    <!-- Theme css -->
    <link rel="stylesheet" type="text/css" href="login_data/login.css">
</head>

<body>
    <!-- 01 Preloader -->
    <div class="loader-wrapper" id="loader-wrapper" style="display: none;">
        <div class="loader"></div>
    </div>
    <!-- Preloader end -->
    <!-- 02 Main page -->
    <section class="page-section login-page">
        <div class="full-width-screen">
            <div class="container-fluid">
                <div class="content-detail">
                    <!-- Login form -->
                    <form class="login-form" method="post">
                        <div class="imgcontainer">
                            <img src="login_data/gate-of-purchase-high-resolution-logo-transparent-min.png" alt="Avatar" class="avatar">
                        </div>
                        <div class="input-control">
                            <input type="text" placeholder="Enter Username" name="uname" required="">
                            <span class="password-field-show">
                                <input type="password" placeholder="Enter Password" name="password" class="password-field" value="" required="">
                                <span data-toggle=".password-field" class=""></span>
                            </span>
                            <label class="label-container">Remember me
                                <input type="checkbox">
                                <span class="checkmark"></span>
                            </label>
                            <span class="psw"><a href="ForGot.htm" class="forgot-btn">Forgot password?</a></span>
                            <div class="login-btns">
                                <button type="submit">Login</button>
                            </div>
                            <div class="division-lines">
                                <p>or login with</p>
                            </div>
                            <div class="login-with-btns">
                                
                                <button type="button" class="facebook"><i class=""></i><img src="login_data/facebook-logo-button-Top_prev_ui.png" alt=""></button>
                                <button type="button" class="twitter"><i class=""></i><img src="twitter-logo-button-Pre.png" alt=""></button>
                                
                                <span class="already-acc">Not a member? <a href="SingUp.htm" class="signup-btn">Sign
                                        up</a></span>
                            </div>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </section>
    <!-- latest jquery-->
    <script src="login_data/jquery-3.5.1.min.js"></script>
    <!-- Theme js-->
    <script src="login_data/script.js"></script>


</body></html>
